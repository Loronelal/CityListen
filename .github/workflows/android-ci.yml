name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Клонируем код
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Устанавливаем Java 17
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.5.0'
        cache-read-only: false

    # 4. Даем права на запуск gradlew (на всякий случай, хотя используем системный gradle)
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 5. Собираем проект (используем системный gradle, чтобы не качать дистрибутив заново)
    - name: Build with Gradle
      run: gradle build

    # 6. Запускаем Detekt (линтер)
    - name: Run Detekt
      run: gradle detekt