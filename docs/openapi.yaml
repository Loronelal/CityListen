openapi: 3.1.0
info:
  title: CityListen API
  version: 1.0.0
  description: |
    API для аудиогида CityListen. 
    Использует JWT-авторизацию (Bearer token). 
    Правила доступа на уровне строк (RLS) реализованы на уровне SQL: 
    пользователь может читать и изменять только свои рассказы и историю.
servers:
  - url: https://citylisten-api.example.workers.dev/v1
    description: Production

security:
  - BearerAuth: []

paths:
  /health:
    get:
      summary: Проверка живости сервера
      security: []
      responses:
        '200':
          description: Сервер работает
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  version: { type: string, example: 1.0.0 }
                  timestamp: { type: string, format: date-time }

  /places/nearby:
    get:
      summary: Поиск объектов рядом с координатами
      parameters:
        - name: lat
          in: query
          required: true
          schema: { type: number, format: double }
        - name: lon
          in: query
          required: true
          schema: { type: number, format: double }
        - name: radius
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
      responses:
        '200':
          description: Список объектов
          content:
            application/json:
              schema:
                type: object
                properties:
                  places:
                    type: array
                    items: { $ref: '#/components/schemas/Place' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /places/{id}:
    get:
      summary: Информация об объекте
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Объект
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Place' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # --- НОВЫЙ CRUD ДЛЯ STORIES ---
  /stories:
    post:
      summary: Сгенерировать и сохранить рассказ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [placeId, language]
              properties:
                placeId: { type: string, example: "osm:123456" }
                language: { type: string, enum: [ru, en] }
      responses:
        '200':
          description: Рассказ успешно создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Story' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/UpstreamError' }
    
    get:
      summary: Получить список всех своих рассказов
      responses:
        '200':
          description: Список рассказов текущего пользователя (RLS)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Story' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /stories/{id}:
    get:
      summary: Получить свой рассказ по id
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Рассказ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Story' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    
    delete:
      summary: Удалить свой рассказ
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Удалено }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # --- НОВЫЙ CRUD ДЛЯ HISTORY ---
  /history:
    post:
      summary: Добавить запись в историю прослушиваний
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [storyId]
              properties:
                storyId: { type: string, example: "story_abc123" }
      responses:
        '201':
          description: Запись создана
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

    get:
      summary: Получить историю прослушиваний (пагинация)
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Страница истории
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/HistoryItem' }
                  page: { type: integer }
                  limit: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /history/{id}:
    delete:
      summary: Удалить запись из своей истории
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Удалено }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Введите JWT-токен, полученный от сервера авторизации (формат `Header.Payload.Signature`).

  schemas:
    Place:
      type: object
      properties:
        id: { type: string }
        name: { type: string, nullable: true }
        type: { type: string, enum: [MONUMENT, BUILDING, PARK, SHOP, CAFE, STREET, UNKNOWN] }
        lat: { type: number }
        lon: { type: number }
        source: { type: string, enum: [OSM, WIKIDATA, WIKIPEDIA] }

    Story:
      type: object
      properties:
        id: { type: string }
        placeId: { type: string }
        title: { type: string }
        text: { type: string }
        language: { type: string }
        createdAt: { type: string, format: date-time }
        cached: { type: boolean }

    HistoryItem:
      type: object
      properties:
        id: { type: string }
        storyId: { type: string }
        listenedAt: { type: string, format: date-time }

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: VALIDATION_ERROR }
            message: { type: string, example: Неверный формат данных }
            details: { type: object, nullable: true }

  responses:
    ValidationError:
      description: Ошибка валидации
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Неверный или просроченный JWT токен
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Объект не найден или нет прав доступа (RLS)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UpstreamError:
      description: Ошибка внешнего сервиса (Groq / Overpass)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }